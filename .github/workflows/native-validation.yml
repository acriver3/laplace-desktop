name: Desktop native validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.28.2
      - name: Verify native target
        run: node -e "if (process.platform + '-' + process.arch !== process.argv[1]) process.exit(1)" ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/desktop package
      - run: pnpm --filter @repo/desktop type-check
      - run: pnpm --filter @repo/desktop test
      - run: pnpm --filter @repo/desktop test:electron --packaged
      - run: pnpm --filter @repo/desktop test:native --packaged
