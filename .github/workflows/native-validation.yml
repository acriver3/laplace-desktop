name: Desktop native validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.28.2
      - name: Verify native target
        run: node -e "if (process.platform + '-' + process.arch !== process.argv[1]) process.exit(1)" ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/desktop make
      - name: Create portable Windows ZIP with standard entry paths
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $destination = "out/make/zip/win32/x64/Laplace-win32-x64-$version.zip"
          python -c "import pathlib,sys,zipfile; root=pathlib.Path('out/Laplace-win32-x64'); files=sorted(p for p in root.rglob('*') if p.is_file()); assert files; z=zipfile.ZipFile(sys.argv[1], 'w', zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root).as_posix()) for p in files]; z.close()" $destination
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/out/make/zip/**/*.zip
            apps/desktop/out/make/squirrel.windows/**/*-full.nupkg
            apps/desktop/out/make/squirrel.windows/**/LaplaceSetup.exe
          if-no-files-found: error
      - run: pnpm --filter @repo/desktop type-check
      - run: pnpm --filter @repo/desktop test
      - run: pnpm --filter @repo/desktop test:electron --packaged
      - run: pnpm --filter @repo/desktop test:native --packaged
      - run: pnpm --filter @repo/desktop test:source-update
